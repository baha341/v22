name: Update Subscription

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download subscription
        run: |
          curl -L --fail "https://bahador.bahadorpma.workers.dev/sub/fragment/absI__TaR%40BzSIla?app=xray#%F0%9F%92%A6%20BPB%20Fragment" -o sub.txt

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add sub.txt

          if ! git diff --staged --quiet; then
            git commit -m "Update subscription"
            git push
          fi
